<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f12" />
  <title>Lite</title>

  <!-- External integration scripts -->
  <script src="https://sazzadcheju49.github.io/portal-app/portalBridge.js?v=1"></script>
  <script src="https://sazzadcheju49.github.io/portal-app/dataSync.js?v=1"></script>

  <meta name="description" content="Lite — Personal productivity launcher and app drawer" />
  <meta name="apple-mobile-web-app-title" content="Lite" />
  <meta name="application-name" content="Lite" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230d0f12'/%3E%3Crect x='96' y='96' width='320' height='320' rx='40' fill='none' stroke='%2338bdf8' stroke-width='32'/%3E%3Cline x1='96' y1='256' x2='416' y2='256' stroke='%2338bdf8' stroke-width='32'/%3E%3Cline x1='256' y1='96' x2='256' y2='416' stroke='%2338bdf8' stroke-width='32'/%3E%3C/svg%3E" />

  <!-- Self-contained Web App Manifest Data-URI -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Lite%22%2C%22short_name%22%3A%22Lite%22%2C%22description%22%3A%22Personal%20productivity%20launcher%20and%20app%20drawer%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230d0f12%22%2C%22theme_color%22%3A%22%230d0f12%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20512%20512'%253E%253Crect%20width%3D'512'%20height%3D'512'%20rx%3D'110'%20fill%3D'%25230d0f12'%2F%253E%253Crect%20x%3D'96'%20y%3D'96'%20width%3D'320'%20height%3D'320'%20rx%3D'40'%20fill%3D'none'%20stroke%3D'%252338bdf8'%20stroke-width%3D'32'%2F%253E%253Cline%20x1%3D'96'%20y1%3D'256'%20x2%3D'416'%20y2%3D'256'%20stroke%3D'%252338bdf8'%20stroke-width%3D'32'%2F%253E%253Cline%20x1%3D'256'%20y1%3D'96'%20x2%3D'256'%20y2%3D'416'%20stroke%3D'%252338bdf8'%20stroke-width%3D'32'%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);

      --bg-base: #0d0f12;
      --bg-card: rgba(255, 255, 255, 0.05);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --border-card: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    .safe-area-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--safe-top);
      background: linear-gradient(to bottom, rgba(13, 15, 18, 0.95), rgba(13, 15, 18, 0.4));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      pointer-events: none;
    }

    #app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 24px);
      padding-left: calc(var(--safe-left) + 16px);
      padding-right: calc(var(--safe-right) + 16px);
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }

    .screen {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .screen.hidden {
      display: none !important;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0 10px 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: var(--accent-color);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .icon-button {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .header-profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 20px 0;
      border-bottom: 1px solid var(--border-card);
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .profile-name {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .profile-tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .avatar-wrapper {
      position: relative;
      width: 54px;
      height: 54px;
      cursor: pointer;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar-img svg {
      width: 26px;
      height: 26px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 1.8;
    }

    .avatar-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-color);
      border: 2px solid var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-badge svg {
      width: 10px;
      height: 10px;
      stroke: #000;
      stroke-width: 3;
    }

    .action-toolbar {
      display: flex;
      gap: 10px;
      padding: 16px 0;
    }

    .btn-action {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-main);
      transition: background 0.15s ease;
    }

    .btn-action:active {
      background: var(--bg-card-hover);
    }

    .btn-action svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    #orchestrator-status-area {
      margin-bottom: 12px;
    }

    /* Single-Column List (Settings-app feel) */
    .app-list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .app-row {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
      touch-action: pan-y;
      position: relative;
    }

    .app-row:active {
      background: var(--bg-card-hover);
    }

    .app-icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .app-icon-badge svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .app-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .app-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .app-row-end {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 10px;
      flex-shrink: 0;
    }

    /* Unsynced Indicator Dot */
    .unsynced-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--warning);
      box-shadow: 0 0 8px var(--warning);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .unsynced-dot.active {
      opacity: 1;
    }

    /* Subtle row chevron */
    .row-arrow {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
      opacity: 0.5;
    }

    /* Registry States: Offline Note & Empty Error Card */
    .registry-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      margin-bottom: 8px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
    }

    .registry-error-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 36px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      margin-top: 24px;
      gap: 14px;
    }

    .registry-error-card svg {
      width: 42px;
      height: 42px;
      stroke: var(--danger);
      fill: none;
      stroke-width: 1.8;
    }

    .registry-error-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .registry-error-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      max-width: 280px;
      line-height: 1.4;
    }

    .btn-retry {
      background: var(--accent-color);
      color: #000;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-retry svg {
      width: 14px;
      height: 14px;
      stroke: #000;
      stroke-width: 2.2;
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 20px 0;
      border-bottom: 1px solid var(--border-card);
      margin-bottom: 16px;
    }

    .settings-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .settings-section {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-section-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    #diagnostics-screen {
      display: flex;
      flex-direction: column;
    }

    #iframe-host {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      border: 0;
    }

    .banner-notification {
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Glassmorphism Surface Defaults */
    .app-row, .btn-action, .settings-header, .header-profile, .banner-notification {
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* Fallback for browsers/devices without backdrop-filter support */
    @supports not ((backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px))) {
      .app-row, .btn-action, #orchestrator-status-area > div {
        background: var(--bg-card-solid) !important;
      }
      .safe-area-gradient {
        background: var(--bg-base) !important;
      }
    }

    /* Themed Mood Definitions */
    body[data-mood="Paper"] {
      --bg-base: #ffffff;
      --bg-card: rgba(0, 0, 0, 0.035);
      --bg-card-hover: rgba(0, 0, 0, 0.06);
      --bg-card-solid: #f4f4f5;
      --border-card: rgba(0, 0, 0, 0.09);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --safe-gradient-start: rgba(255, 255, 255, 0.96);
      --safe-gradient-end: rgba(255, 255, 255, 0.4);
    }

    body[data-mood="Fog"] {
      --bg-base: #f3f4f6;
      --bg-card: rgba(0, 0, 0, 0.03);
      --bg-card-hover: rgba(0, 0, 0, 0.055);
      --bg-card-solid: #e5e7eb;
      --border-card: rgba(0, 0, 0, 0.08);
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --safe-gradient-start: rgba(243, 244, 246, 0.96);
      --safe-gradient-end: rgba(243, 244, 246, 0.4);
    }

    body[data-mood="Cream"] {
      --bg-base: #fbf8f2;
      --bg-card: rgba(60, 40, 20, 0.035);
      --bg-card-hover: rgba(60, 40, 20, 0.065);
      --bg-card-solid: #f2ebe0;
      --border-card: rgba(60, 40, 20, 0.09);
      --text-main: #292524;
      --text-muted: #78716c;
      --safe-gradient-start: rgba(251, 248, 242, 0.96);
      --safe-gradient-end: rgba(251, 248, 242, 0.4);
    }

    body[data-mood="Obsidian"] {
      --bg-base: #000000;
      --bg-card: rgba(255, 255, 255, 0.06);
      --bg-card-hover: rgba(255, 255, 255, 0.09);
      --bg-card-solid: #121212;
      --border-card: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --safe-gradient-start: rgba(0, 0, 0, 0.96);
      --safe-gradient-end: rgba(0, 0, 0, 0.4);
    }

    body[data-mood="Slate"] {
      --bg-base: #13171f;
      --bg-card: rgba(255, 255, 255, 0.045);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --bg-card-solid: #1f242e;
      --border-card: rgba(255, 255, 255, 0.075);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --safe-gradient-start: rgba(19, 23, 31, 0.96);
      --safe-gradient-end: rgba(19, 23, 31, 0.4);
    }

    body[data-mood="Dusk"] {
      --bg-base: #0d1527;
      --bg-card: rgba(255, 255, 255, 0.05);
      --bg-card-hover: rgba(255, 255, 255, 0.085);
      --bg-card-solid: #18223c;
      --border-card: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --safe-gradient-start: rgba(13, 21, 39, 0.96);
      --safe-gradient-end: rgba(13, 21, 39, 0.4);
    }

    .safe-area-gradient {
      background: linear-gradient(to bottom, var(--safe-gradient-start, rgba(0, 0, 0, 0.95)), var(--safe-gradient-end, rgba(0, 0, 0, 0.4))) !important;
    }

    /* Mood selection tiles */
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mood-btn {
      padding: 10px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .mood-btn.active {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 1px var(--accent-color);
    }

    .mood-indicator-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15);
    }

    /* Accent color swatches */
    .accent-grid {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .accent-swatch {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .accent-swatch:hover {
      transform: scale(1.08);
    }

    .accent-swatch.active {
      border-color: var(--text-main);
      box-shadow: 0 0 0 2px var(--bg-base);
    }

    .accent-swatch svg {
      width: 16px;
      height: 16px;
      stroke: #000;
      stroke-width: 3;
      display: none;
    }

    .accent-swatch.active svg {
      display: block;
    }

    /* Drag-to-reorder styling */
    .app-row {
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
      cursor: grab;
    }

    .app-row.dragging {
      opacity: 0.55;
      background: var(--bg-card-hover);
      border-color: var(--accent-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      cursor: grabbing;
      z-index: 100;
    }

    .app-row.drag-over-top {
      border-top: 2px solid var(--accent-color);
    }

    .app-row.drag-over-bottom {
      border-bottom: 2px solid var(--accent-color);
    }

    .drag-handle-indicator {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 0 4px;
      opacity: 0.35;
      cursor: grab;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .drag-handle-indicator span {
      width: 14px;
      height: 2px;
      background: var(--text-muted);
      border-radius: 1px;
    }
  </style>
</head>
<body>
  <div class="safe-area-gradient" aria-hidden="true"></div>
  <div id="iframe-host" aria-hidden="true"></div>

  <div id="app-container">
    <div id="sw-update-banner" class="banner-notification" style="display:none;"></div>

    <!-- MAIN SCREEN -->
    <main id="main-screen" class="screen">
      <header class="header-nav">
        <div class="brand-group">
          <svg class="brand-icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="12" y1="3" x2="12" y2="21" />
          </svg>
          <span class="brand-title">Lite</span>
        </div>

        <button id="btn-open-settings" class="icon-button" aria-label="Open Settings">
          <svg viewBox="0 0 24 24">
            <line x1="4" y1="7" x2="20" y2="7" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="17" x2="20" y2="17" />
          </svg>
        </button>
      </header>

      <section class="header-profile">
        <div class="profile-info" id="profile-info-trigger" title="Edit name & tagline">
          <h1 class="profile-name" id="user-display-name">My Workspace</h1>
          <p class="profile-tagline" id="user-display-tagline">Personal Productivity Ecosystem</p>

  <script>
    const LiteApp = {
      state: {
        registry: [],
        savedOrder: [],
        unsyncedAppIds: new Set(),
        token: localStorage.getItem('lite_github_token') || '',
        lastSyncTimestamp: localStorage.getItem('lite_last_sync') || null,
        activeMood: localStorage.getItem('lite_mood') || 'Obsidian',
        activeAccent: localStorage.getItem('lite_accent') || '#38bdf8',
        userName: localStorage.getItem('lite_user_name') || 'My Workspace',
        userTagline: localStorage.getItem('lite_user_tagline') || 'Personal Productivity Ecosystem',
        avatarDataUrl: localStorage.getItem('lite_user_avatar') || null
      }
    };

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => {
        if (el.id !== 'profile-edit-modal') el.classList.add('hidden');
      });
      const target = document.getElementById(screenId);
      if (target) target.classList.remove('hidden');
    }

    document.getElementById('btn-open-settings').addEventListener('click', () => {
      showScreen('settings-screen');
    });

    document.getElementById('btn-close-settings').addEventListener('click', () => {
      showScreen('main-screen');
    });

    /* =========================================================
       SEGMENT 2: Registry Fetch & List Rendering (Implemented)
       ========================================================= */

    // Bundled pure SVG Icon Library (SVG-only rule compliant)
    const BUNDLED_ICONS = {
      'wallet': `<path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 3H4a2 2 0 0 0-2 2v2"/><circle cx="17" cy="14" r="1.5" fill="currentColor"/>`,
      'check-square': `<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>`,
      'flame': `<path d="M8.5 14.5A4.5 4.5 0 0 0 13 19a4.5 4.5 0 0 0 4.5-4.5c0-2-1.5-4-3-5.5-1.5 2-2.5 3-4.5 3-1.5 0-2.5-1-2.5-2.5C7.5 7 11 3 11 3s-6.5 4.5-6.5 10a6 6 0 0 0 6 6c.7 0 1.5-.1 2-.4-1.2-.8-2-2.1-2-3.6z"/>`,
      'file-text': `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>`,
      'orbit': `<circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(30 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"/>`,
      'calendar': `<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>`,
      'heart-pulse': `<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>`,
      'book-open': `<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>`,
      'users': `<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
      'folder': `<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>`,
      'bell': `<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>`,
      'pie-chart': `<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>`,
      'bookmark': `<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>`,
      'utensils': `<path d="M18 2v20M14 2v6a2 2 0 0 0 2 2h4M6 2v6a3 3 0 0 0 6 0V2M9 11v11"/>`,
      'activity': `<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>`,
      'box': `<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>`
    };

    function renderIcon(iconKey, color) {
      const innerSvg = BUNDLED_ICONS[iconKey] || BUNDLED_ICONS['box'];
      return `
        <svg viewBox="0 0 24 24" style="stroke: ${color || 'var(--accent-color)'};">
          ${innerSvg}
        </svg>
      `;
    }

    const REGISTRY_PRIMARY_URL = 'https://sazzadcheju49.github.io/portal-app/app-registry.json';
    const REGISTRY_FALLBACK_URL = './app-registry.json';
    const REGISTRY_CACHE_KEY = 'lite_app_registry_cache';
    const SAVED_ORDER_KEY = 'lite_saved_order';

    async function fetchRegistryWithFallback() {
      // Try primary network URL; if fails, attempt relative URL for local development/testing
      let response = null;
      try {
        response = await fetch(REGISTRY_PRIMARY_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('Primary registry returned ' + response.status);
      } catch (primaryErr) {
        try {
          response = await fetch(REGISTRY_FALLBACK_URL, { cache: 'no-store' });
          if (!response.ok) throw new Error('Fallback registry returned ' + response.status);
        } catch (secErr) {
          throw new Error('All network attempts failed');
        }
      }
      const data = await response.json();
      if (!Array.isArray(data)) throw new Error('Registry data is not an array');
      return data;
    }

    function renderAppList(apps, isOfflineCached = false) {
      const listEl = document.getElementById('app-list');
      const bannerEl = document.getElementById('registry-status-banner');

      if (isOfflineCached) {
        bannerEl.innerHTML = `
          <div class="registry-banner">
            <span style="display:inline-flex; align-items:center; gap:6px;">
              <svg viewBox="0 0 24 24" style="width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2;">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              Offline — showing last known apps
            </span>
          </div>
        `;
      } else {
        bannerEl.innerHTML = '';
      }

      if (!apps || apps.length === 0) {
        listEl.innerHTML = `
          <div class="registry-error-card">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div class="registry-error-title">No apps found</div>
            <div class="registry-error-desc">The registry returned an empty list.</div>
            <button class="btn-retry" onclick="loadRegistry()">
              <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              <span>Retry</span>
            </button>
          </div>
        `;
        return;
      }

      listEl.innerHTML = apps.map(app => {
        const themeColor = app.themeColor || 'var(--accent-color)';
        const iconSvg = renderIcon(app.icon, themeColor);
        const isUnsynced = LiteApp.state.unsyncedAppIds.has(app.id);

        return `
          <article class="app-row" data-id="${app.id}" data-url="${app.baseUrl}">
            <div class="app-icon-badge" style="background: ${themeColor}15; border-color: ${themeColor}30;">
              ${iconSvg}
            </div>
            <div class="app-meta">
              <span class="app-name">${app.name}</span>
              <span class="app-subtitle">${app.subtitle || ''}</span>
            </div>
            <div class="app-row-end">
              <span class="unsynced-dot ${isUnsynced ? 'active' : ''}" id="dot-${app.id}" title="Unsynced changes"></span>
              <svg class="row-arrow" viewBox="0 0 24 24">

    function renderFirstLaunchError() {

    async function loadRegistry() {
      const listEl = document.getElementById('app-list');
      // Show light loading placeholder if empty
      if (LiteApp.state.registry.length === 0) {
        listEl.innerHTML = `
          <div style="text-align:center; padding:32px 0; color:var(--text-muted); font-size:0.85rem;">
            Loading apps...
          </div>
        `;
      }

      let registryData = null;
      let isCached = false;

      try {
        registryData = await fetchRegistryWithFallback();
        // Persist fresh copy to local cache
        localStorage.setItem(REGISTRY_CACHE_KEY, JSON.stringify(registryData));
      } catch (err) {
        // Fall back to cached copy
        const cachedRaw = localStorage.getItem(REGISTRY_CACHE_KEY);
        if (cachedRaw) {
          try {
            registryData = JSON.parse(cachedRaw);
            isCached = true;
          } catch (e) {
            registryData = null;
          }
        }
      }

      if (!registryData) {
        renderFirstLaunchError();
        return;
      }

      LiteApp.state.registry = registryData;
      renderAppList(registryData, isCached);
    }

       ========================================================= */

    const UNSYNCED_STORAGE_KEY = 'lite_unsynced_apps';

    // Initialize unsynced state from localStorage
    try {
      const storedUnsynced = JSON.parse(localStorage.getItem(UNSYNCED_STORAGE_KEY) || '[]');
      LiteApp.state.unsyncedAppIds = new Set(storedUnsynced);
    } catch (e) {
      LiteApp.state.unsyncedAppIds = new Set();

    function saveUnsyncedState() {
      localStorage.setItem(
        UNSYNCED_STORAGE_KEY,
        JSON.stringify(Array.from(LiteApp.state.unsyncedAppIds))
      );

    function markAppUnsynced(appId) {
      LiteApp.state.unsyncedAppIds.add(appId);
      saveUnsyncedState();
      const dotEl = document.getElementById(`dot-${appId}`);
      if (dotEl) dotEl.classList.add('active');

    function reconcileAndSortApps(registryApps) {
      let savedOrder = [];
      try {
        savedOrder = JSON.parse(localStorage.getItem(SAVED_ORDER_KEY) || '[]');
      } catch (e) {
        savedOrder = [];
      }

      const registryMap = new Map(registryApps.map(app => [app.id, app]));
      const orderedApps = [];

      // 1. Preserve existing valid order
      savedOrder.forEach(id => {
        if (registryMap.has(id)) {
          orderedApps.push(registryMap.get(id));
          registryMap.delete(id);
        }
      });

      // 2. Append new registry apps to the bottom
      registryMap.forEach(app => {
        orderedApps.push(app);
      });

      // 3. Persist cleaned/reconciled order
      LiteApp.state.savedOrder = orderedApps.map(a => a.id);
      localStorage.setItem(SAVED_ORDER_KEY, JSON.stringify(LiteApp.state.savedOrder));

      return orderedApps;
    }

    function saveNewOrderFromDOM() {
      const rows = document.querySelectorAll('#app-list .app-row');
      const newOrder = Array.from(rows).map(row => row.dataset.id);
      LiteApp.state.savedOrder = newOrder;
      localStorage.setItem(SAVED_ORDER_KEY, JSON.stringify(newOrder));
    }

    function attachRowInteractions() {
      const listContainer = document.getElementById('app-list');
      const rows = listContainer.querySelectorAll('.app-row');

      let draggedRow = null;
      let startY = 0;
      let isDragging = false;
      let currentPointerId = null;

      rows.forEach(row => {
        const appId = row.dataset.id;
        const targetUrl = row.dataset.url;

        // Pointer event based drag & tap differentiation
        row.addEventListener('pointerdown', e => {
          // Only primary mouse button or single touch
          if (e.button !== 0 && e.pointerType === 'mouse') return;
          draggedRow = row;
          startY = e.clientY;
          isDragging = false;
          currentPointerId = e.pointerId;
        });

        row.addEventListener('pointermove', e => {
          if (!draggedRow || e.pointerId !== currentPointerId) return;
          const deltaY = Math.abs(e.clientY - startY);

          // Threshold of 8px to distinguish deliberate drag from a tap
          if (deltaY > 8 && !isDragging) {
            isDragging = true;
            draggedRow.classList.add('dragging');
            try {
              draggedRow.setPointerCapture(e.pointerId);
            } catch (err) {}
          }

          if (isDragging) {
            e.preventDefault();
            const targetElement = document.elementFromPoint(e.clientX, e.clientY);
            const overRow = targetElement ? targetElement.closest('.app-row') : null;

            if (overRow && overRow !== draggedRow && listContainer.contains(overRow)) {
              const bounding = overRow.getBoundingClientRect();
              const offset = e.clientY - bounding.top;
              if (offset > bounding.height / 2) {
                listContainer.insertBefore(draggedRow, overRow.nextSibling);
              } else {
                listContainer.insertBefore(draggedRow, overRow);
              }
            }
          }
        });

        const handlePointerEnd = e => {
          if (!draggedRow || e.pointerId !== currentPointerId) return;

          if (isDragging) {
            draggedRow.classList.remove('dragging');
            try {
              draggedRow.releasePointerCapture(e.pointerId);
            } catch (err) {}
            saveNewOrderFromDOM();
          } else {
            // It's a clean tap: mark unsynced immediately and navigate
            markAppUnsynced(appId);
            if (targetUrl) {
              window.location.href = targetUrl;
            }
          }

          draggedRow = null;
          isDragging = false;
          currentPointerId = null;
        };

        row.addEventListener('pointerup', handlePointerEnd);
        row.addEventListener('pointercancel', handlePointerEnd);
      });
    }

      reader.onload = event => {

          // Offscreen canvas center-crop & resize

          const size = 160;
          canvas.width = size;
          canvas.height = size;

          const minDim = Math.min(img.width, img.height);
          const cropX = (img.width - minDim) / 2;
          const cropY = (img.height - minDim) / 2;

          ctx.drawImage(img, cropX, cropY, minDim, minDim, 0, 0, size, size);
          
          // Compressed JPEG dataURL (< 20 KB)
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

          LiteApp.state.avatarDataUrl = compressedDataUrl;

    // Test token connection against GitHub API
    async function validateGitHubToken(token) {
      if (!token) throw new Error('Token is empty');
      const response = await fetch('https://api.github.com/user', {
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });
      if (response.status === 401) {
        throw { code: 401, message: 'Your token has expired or is invalid — generate a new one' };
      }
      if (!response.ok) {
        throw new Error(`GitHub API responded with status ${response.status}`);
      }
      const data = await response.json();
      const scopes = response.headers.get('x-oauth-scopes') || '';
      return { login: data.login, hasGist: scopes.includes('gist') };
    }

    function showTokenWarning(message) {
      settingsTokenWarning.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px; color:var(--danger); width:100%;">
          <svg viewBox="0 0 24 24" style="width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; flex-shrink:0;">

    btnTestToken.addEventListener('click', async () => {
      const token = inputGithubToken.value.trim();
      if (!token) {

        return;

      const spinner = document.getElementById('test-token-spinner');
      spinner.style.display = 'inline-block';
      tokenStatusNote.style.color = 'var(--text-muted)';
      tokenStatusNote.textContent = 'Testing connection…';

      try {
        const result = await validateGitHubToken(token);
        tokenStatusNote.style.color = 'var(--success)';
        tokenStatusNote.textContent = `Valid token (user: @${result.login}${result.hasGist ? ', gist scope ✓' : ', missing gist scope ⚠'})`;
        settingsTokenWarning.style.display = 'none';
      } catch (err) {
        tokenStatusNote.textContent = '';
        if (err.code === 401) {
          showTokenWarning('Your token has expired or is invalid — generate a new one');

    // Storage Statistics Calculation
    function updateStorageStats() {
      let totalBytes = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const value = localStorage.getItem(key);
        totalBytes += (key.length + value.length) * 2; // UTF-16 character approximation
      }

      const kb = (totalBytes / 1024).toFixed(1);
      const statLocal = document.getElementById('stat-local-storage');
      if (statLocal) statLocal.textContent = `${kb} KB (${localStorage.length} keys)`;

      const statGist = document.getElementById('stat-last-gist-time');
      const gistStatsRaw = localStorage.getItem(GIST_BACKUP_STATS_KEY);
      if (gistStatsRaw && statGist) {
        try {
          const stats = JSON.parse(gistStatsRaw);
          const dateStr = new Date(stats.timestamp).toLocaleString(undefined, {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });
          statGist.textContent = `${dateStr} (${(stats.bytes / 1024).toFixed(1)} KB)`;
        } catch (e) {
          statGist.textContent = 'None';
        }
      }
    }

    function syncSingleApp(app, token) {
      return new Promise(resolve => {
        const iframe = document.createElement('iframe');
        iframe.style.position = 'absolute';
        iframe.style.top = '-9999px';
        iframe.style.left = '-9999px';
        iframe.style.width = '1px';
        iframe.style.height = '1px';
        iframe.style.border = '0';

        let isResolved = false;
        let timeoutId = null;

        const cleanup = () => {
          if (timeoutId) clearTimeout(timeoutId);
          window.removeEventListener('message', handleMessage);
          if (iframe.parentNode) {
            iframe.parentNode.removeChild(iframe);
          }
        };

        const handleMessage = event => {
          const data = event.data;
          if (!data || typeof data !== 'object') return;

          // Member app's dataSync.js protocol
          if (data.type === 'dataSyncComplete') {
            if (isResolved) return;
            isResolved = true;
            cleanup();

            if (data.status === 401 || (data.result && data.result.status === 401)) {
              resolve({ appId: app.id, status: 'unauthorized', raw: data });
            } else if (data.status === 'success' || data.status === 200 || data.result) {
              resolve({ appId: app.id, status: 'success', raw: data });
            } else {
              // Treat non-401 failure same as timeout/failure per spec
              resolve({ appId: app.id, status: 'failed', raw: data });
            }
          }
        };

        window.addEventListener('message', handleMessage);

        // 15-second strict timeout per app
        timeoutId = setTimeout(() => {
          if (isResolved) return;
          isResolved = true;
          cleanup();
          resolve({ appId: app.id, status: 'timeout' });
        }, 15000);

        // Build autosync URL with token
        const delimiter = app.baseUrl.includes('?') ? '&' : '?';
        const syncUrl = `${app.baseUrl}${delimiter}syncToken=${encodeURIComponent(token)}&autosync=1`;

        iframe.src = syncUrl;
        iframeHost.appendChild(iframe);
      });
    }

    async function runSyncAll() {
      if (isSyncingAll) return;

      const token = LiteApp.state.token || localStorage.getItem(GITHUB_TOKEN_KEY);
      if (!token) {
        alert('Please enter and save your GitHub Sync Token first.');
        showScreen('settings-screen');
        const tokenInput = document.getElementById('input-github-token');
        if (tokenInput) tokenInput.focus();
        return;
      }

      const apps = LiteApp.state.registry;
      if (!apps || apps.length === 0) {
        alert('No apps loaded to sync.');
        return;
      }

      isSyncingAll = true;
      btnSyncAll.style.opacity = '0.6';
      btnSyncAll.disabled = true;

      const appResults = {};
      apps.forEach(a => {
        appResults[a.name] = { status: 'pending' };
      });

      renderSyncProgressCard(0, apps.length, '', appResults);

      let completedCount = 0;
      let hasUnauthorized = false;

      for (const app of apps) {
        appResults[app.name] = { status: 'syncing' };
        renderSyncProgressCard(completedCount, apps.length, app.name, appResults);

        try {
          const outcome = await syncSingleApp(app, token);

          if (outcome.status === 'success') {
            appResults[app.name] = { status: 'success' };
            // Clear unsynced state for this app
            LiteApp.state.unsyncedAppIds.delete(app.id);
            saveUnsyncedState();
            const dot = document.getElementById(`dot-${app.id}`);
            if (dot) dot.classList.remove('active');
          } else if (outcome.status === 'unauthorized') {
            appResults[app.name] = { status: 'failed' };
            hasUnauthorized = true;
          } else {
            appResults[app.name] = { status: outcome.status }; // 'timeout' or 'failed'
          }
        } catch (err) {
          appResults[app.name] = { status: 'failed' };
        }

        completedCount++;
        renderSyncProgressCard(completedCount, apps.length, '', appResults);
      }

      // Save final sync timestamp
      const nowIso = new Date().toISOString();
      LiteApp.state.lastSyncTimestamp = nowIso;
      localStorage.setItem(LAST_SYNC_KEY, nowIso);

      // Handle 401 token expiration warning if triggered anywhere
      if (hasUnauthorized) {
        showTokenWarning('Your token has expired or is invalid — generate a new one');
      }

      // Restore UI buttons
      isSyncingAll = false;
      btnSyncAll.style.opacity = '1';
      btnSyncAll.disabled = false;

      // Automatically collapse progress card after 7 seconds
      setTimeout(() => {
        if (!isSyncingAll && statusArea) {
          statusArea.innerHTML = `
            <div style="font-size:0.75rem; color:var(--text-muted); text-align:right; padding:2px 4px;">
              Last synced: ${new Date(nowIso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </div>
          `;
        }
      }, 7000);
    }

    btnSyncAll.addEventListener('click', runSyncAll);

    /* =========================================================
       SEGMENT 7: Refresh All Orchestrator (Implemented)
       ========================================================= */

    let isRefreshingAll = false;
    const btnRefreshAll = document.getElementById('btn-refresh-all');

    function renderRefreshProgressCard(completedCount, totalCount, activeAppName, appResults) {
      const percentage = Math.round((completedCount / totalCount) * 100);

      const resultsHtml = Object.entries(appResults).map(([name, res]) => {
        let badgeColor = 'var(--text-muted)';
        let symbol = '…';
        if (res.status === 'refreshed') {
          badgeColor = 'var(--success)';
          symbol = '✓';
        } else if (res.status === 'timed out' || res.status === 'failed') {
          badgeColor = 'var(--danger)';
          symbol = '✗';
        } else if (res.status === 'refreshing') {
          badgeColor = 'var(--accent-color)';
          symbol = '⟳';
        }

        return `
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; padding:2px 0;">
            <span style="color:var(--text-main);">${name}</span>
            <span style="color:${badgeColor}; font-weight:600;">${res.status} ${symbol}</span>
          </div>
        `;
      }).join('');

      statusArea.innerHTML = `
        <div style="background:var(--bg-card); border:1px solid var(--border-card); border-radius:14px; padding:12px 14px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.8rem; font-weight:600; color:var(--text-main);">
              ${completedCount < totalCount ? `Refreshing app caches (${completedCount}/${totalCount})…` : 'Refresh complete'}
            </span>
            <span style="font-size:0.75rem; color:var(--text-muted);">${percentage}%</span>
          </div>

          <div style="width:100%; height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden;">
            <div style="width:${percentage}%; height:100%; background:var(--accent-color); transition:width 0.3s ease;"></div>
          </div>

          <div style="max-height:110px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; margin-top:4px;">
            ${resultsHtml}
          </div>
        </div>
      `;
    }

    function refreshSingleApp(app) {
      return new Promise(resolve => {
        const iframe = document.createElement('iframe');
        iframe.style.position = 'absolute';
        iframe.style.top = '-9999px';
        iframe.style.left = '-9999px';
        iframe.style.width = '1px';
        iframe.style.height = '1px';
        iframe.style.border = '0';

        let isResolved = false;
        let timeoutId = null;

        const cleanup = () => {
          if (timeoutId) clearTimeout(timeoutId);
          window.removeEventListener('message', handleMessage);
          if (iframe.parentNode) {
            iframe.parentNode.removeChild(iframe);
          }
        };

        const handleMessage = event => {
          const data = event.data;
          if (!data || typeof data !== 'object') return;

          // Acknowledgment from member app service worker / window listener
          if (data.type === 'forceUpdateComplete' || data.type === 'cacheCleared') {
            if (isResolved) return;
            isResolved = true;
            cleanup();
            resolve({ appId: app.id, status: 'refreshed' });
          }
        };

        window.addEventListener('message', handleMessage);

        // 8-second timeout for cache refresh dispatch
        timeoutId = setTimeout(() => {
          if (isResolved) return;
          isResolved = true;
          cleanup();
          // If the iframe loaded and we sent the message, treat as sent/timed-out gracefully
          resolve({ appId: app.id, status: 'timed out' });
        }, 8000);

        iframe.onload = () => {
          try {
            // Post force update message to member app
            iframe.contentWindow.postMessage(
              {
                type: 'FORCE_UPDATE',
                action: 'clearCacheAndReload',
                source: 'lite_launcher',
                timestamp: Date.now()
              },
              '*'
            );
          } catch (err) {
            // Handled by timeout or completion
          }
        };

        iframe.src = app.baseUrl;
        iframeHost.appendChild(iframe);
      });
    }

    async function runRefreshAll() {
      if (isRefreshingAll || isSyncingAll) return;

      const apps = LiteApp.state.registry;
      if (!apps || apps.length === 0) {
        alert('No apps loaded to refresh.');
        return;
      }

      isRefreshingAll = true;
      btnRefreshAll.style.opacity = '0.6';
      btnRefreshAll.disabled = true;

      const appResults = {};
      apps.forEach(a => {
        appResults[a.name] = { status: 'pending' };
      });

      renderRefreshProgressCard(0, apps.length, '', appResults);

      let completedCount = 0;

      for (const app of apps) {
        appResults[app.name] = { status: 'refreshing' };
        renderRefreshProgressCard(completedCount, apps.length, app.name, appResults);

        try {
          const outcome = await refreshSingleApp(app);
          appResults[app.name] = { status: outcome.status };
        } catch (err) {
          appResults[app.name] = { status: 'failed' };
        }

        completedCount++;
        renderRefreshProgressCard(completedCount, apps.length, '', appResults);
      }

      isRefreshingAll = false;
      btnRefreshAll.style.opacity = '1';
      btnRefreshAll.disabled = false;

      // Collapse progress card after 6 seconds
      setTimeout(() => {
        if (!isRefreshingAll && !isSyncingAll && statusArea) {
          statusArea.innerHTML = '';
        }
      }, 6000);
    }

    btnRefreshAll.addEventListener('click', runRefreshAll);

    /* =========================================================
       SEGMENT 8: Theming System (Moods & Accents) (Implemented)
       ========================================================= */

    const MOOD_STORAGE_KEY = 'lite_mood';
    const ACCENT_STORAGE_KEY = 'lite_accent';

    const MOOD_BACKGROUNDS = {
      'Paper': '#ffffff',
      'Fog': '#f3f4f6',
      'Cream': '#fbf8f2',
      'Obsidian': '#000000',
      'Slate': '#13171f',
      'Dusk': '#0d1527'
    };

    function applyMood(moodName) {
      if (!MOOD_BACKGROUNDS[moodName]) moodName = 'Obsidian';
      document.body.setAttribute('data-mood', moodName);
      LiteApp.state.activeMood = moodName;
      localStorage.setItem(MOOD_STORAGE_KEY, moodName);

      // Update meta theme-color tag to sync phone status bar
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        metaTheme.setAttribute('content', MOOD_BACKGROUNDS[moodName]);
      }

      // Update mood buttons UI
      document.querySelectorAll('#mood-picker .mood-btn').forEach(btn => {
        if (btn.dataset.mood === moodName) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function applyAccent(colorHex) {
      LiteApp.state.activeAccent = colorHex;
      localStorage.setItem(ACCENT_STORAGE_KEY, colorHex);
      document.documentElement.style.setProperty('--accent-color', colorHex);
      document.documentElement.style.setProperty('--accent-glow', `${colorHex}40`);

      // Update accent swatches UI
      document.querySelectorAll('#accent-picker .accent-swatch').forEach(swatch => {
        if (swatch.dataset.accent.toLowerCase() === colorHex.toLowerCase()) {
          swatch.classList.add('active');
        } else {
          swatch.classList.remove('active');
        }
      });
    }

    // Attach listeners
    document.querySelectorAll('#mood-picker .mood-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyMood(btn.dataset.mood);
      });
    });

    document.querySelectorAll('#accent-picker .accent-swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        applyAccent(swatch.dataset.accent);
      });
    });

    // Initialize saved mood & accent
    applyMood(LiteApp.state.activeMood);
    applyAccent(LiteApp.state.activeAccent);

    /* =========================================================
       SEGMENT 9: Offline & Service Worker (Implemented)
       ========================================================= */

    const swUpdateBanner = document.getElementById('sw-update-banner');

    function showUpdatePrompt(waitingWorker) {
      if (!swUpdateBanner) return;

      swUpdateBanner.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; background:rgba(56,189,248,0.15); border:1px solid var(--accent-color); padding:10px 14px; border-radius:12px; color:var(--text-main);">
          <span style="font-size:0.8rem; font-weight:600;">Update available</span>
          <button id="btn-sw-apply-update" type="button" style="background:var(--accent-color); color:#000; border:none; padding:6px 12px; border-radius:8px; font-size:0.75rem; font-weight:700; cursor:pointer;">
            Tap to refresh
          </button>
        </div>
      `;
      swUpdateBanner.style.display = 'block';

      document.getElementById('btn-sw-apply-update').addEventListener('click', () => {
        if (waitingWorker) {
          waitingWorker.postMessage({ action: 'skipWaiting' });
        }
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            // Case 1: An updated service worker is already waiting
            if (registration.waiting) {
              showUpdatePrompt(registration.waiting);
              return;
            }

            // Case 2: An updated service worker is currently installing
            registration.addEventListener('updatefound', () => {
              const installingWorker = registration.installing;
              if (!installingWorker) return;

              installingWorker.addEventListener('statechange', () => {
                if (installingWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller) {
                    // New update found and waiting
                    showUpdatePrompt(installingWorker);
                  }
                }
              });
            });
          })
          .catch(err => {
            console.warn('Service worker registration bypassed or failed:', err);
          });

        // When the waiting service worker takes over, reload to apply clean state
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }

    /* =========================================================
       SEGMENT 10: Hidden Diagnostics Page (Implemented)
       ========================================================= */

    const DIAGNOSTICS_STORAGE_KEY = 'lite_diagnostics_log';
    const MAX_LOG_ENTRIES = 200;

    // Load persisted log buffer
    function getDiagnosticsLog() {
      try {
        return JSON.parse(localStorage.getItem(DIAGNOSTICS_STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    // Structured Activity Logger (capped ring buffer at 200 entries)
    function logDiagnosticEvent(category, eventName, details = {}) {
      const logs = getDiagnosticsLog();
      const entry = {
        id: Date.now() + '-' + Math.random().toString(36).substr(2, 4),
        timestamp: new Date().toISOString(),
        category, // 'BRIDGE', 'SYNC', 'REFRESH', 'SW', 'REGISTRY'
        eventName,
        details
      };

      logs.push(entry);
      if (logs.length > MAX_LOG_ENTRIES) {
        logs.splice(0, logs.length - MAX_LOG_ENTRIES);
      }

      try {
        localStorage.setItem(DIAGNOSTICS_STORAGE_KEY, JSON.stringify(logs));
      } catch (err) {
        console.warn('Diagnostics storage failed', err);
      }
    }

    // Native Bridge invoker with error branching and diagnostics logging
    async function invokePortalBridge(action, payload = {}) {
      if (typeof PortalBridge === 'undefined' || !PortalBridge.isInsideShell()) {
        const fallbackMsg = 'Outside Omega shell — degraded gracefully';
        logDiagnosticEvent('BRIDGE', action, { status: 'DEGRADED_STANDALONE', payload });
        return { success: false, reason: fallbackMsg };
      }

      try {
        const result = await PortalBridge.call(action, payload);
        logDiagnosticEvent('BRIDGE', action, { status: 'SUCCESS', result });
        return { success: true, result };
      } catch (bridgeError) {
        // Strict branching on Bridge Error codes (Part A Rule #2)
        const code = bridgeError.code || 'UNKNOWN_ERROR';
        const details = {
          code,
          message: bridgeError.message,
          errorType: [
            'NOT_PERMITTED',
            'TIMEOUT',
            'PROTOCOL_MISMATCH',
            'INVALID_PAYLOAD',
            'NATIVE_ERROR'
          ].includes(code) ? code : 'NATIVE_ERROR'
        };
        logDiagnosticEvent('BRIDGE', action, { status: 'ERROR', ...details });
        return { success: false, error: details };
      }
    }

    // Diagnostics Viewer Rendering
    function renderDiagnosticsLog() {
      const logs = getDiagnosticsLog();
      const container = document.getElementById('diagnostics-log-container');
      const countBadge = document.getElementById('log-count-badge');
      if (countBadge) countBadge.textContent = `${logs.length} / ${MAX_LOG_ENTRIES}`;

      if (!container) return;

      if (logs.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:32px 0; color:var(--text-muted);">
            No diagnostics logged yet.
          </div>
        `;
        return;
      }

      const categoryColors = {
        'BRIDGE': '#38bdf8',
        'SYNC': '#34d399',
        'REFRESH': '#a78bfa',
        'SW': '#fbbf24',
        'REGISTRY': '#fb7185'
      };

      container.innerHTML = logs.slice().reverse().map(item => {
        const timeStr = new Date(item.timestamp).toLocaleTimeString([], {
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
        const color = categoryColors[item.category] || 'var(--text-muted)';
        const detailsStr = Object.keys(item.details).length > 0 
          ? JSON.stringify(item.details, null, 1).replace(/\n\s*/g, ' ') 
          : '';

        return `
          <div style="background:var(--bg-card); border:1px solid var(--border-card); border-radius:8px; padding:6px 10px; display:flex; flex-direction:column; gap:3px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="display:inline-flex; align-items:center; gap:6px;">
                <span style="background:${color}22; color:${color}; border:1px solid ${color}44; border-radius:4px; padding:1px 4px; font-weight:700; font-size:0.65rem;">${item.category}</span>
                <strong style="color:var(--text-main); font-size:0.74rem;">${item.eventName}</strong>
              </span>
              <span style="color:var(--text-muted); font-size:0.65rem;">${timeStr}</span>
            </div>
            ${detailsStr ? `<div style="color:var(--text-muted); word-break:break-all; font-size:0.68rem;">${detailsStr}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    // Hidden Entry Point Trigger: Long press (>800ms) on Version number
    const versionLabel = document.getElementById('app-version-label');
    let pressTimer = null;

    function startLongPress() {
      pressTimer = setTimeout(() => {
        // Trigger haptic if in shell or navigator
        if (navigator.vibrate) navigator.vibrate(50);
        renderDiagnosticsLog();
        showScreen('diagnostics-screen');
      }, 800);
    }

    function cancelLongPress() {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    }

    versionLabel.addEventListener('pointerdown', startLongPress);
    versionLabel.addEventListener('pointerup', cancelLongPress);
    versionLabel.addEventListener('pointerleave', cancelLongPress);
    versionLabel.addEventListener('pointercancel', cancelLongPress);

    // Diagnostics Screen Actions
    document.getElementById('btn-close-diagnostics').addEventListener('click', () => {
      showScreen('settings-screen');
    });

    document.getElementById('btn-clear-log').addEventListener('click', () => {
      localStorage.removeItem(DIAGNOSTICS_STORAGE_KEY);
      renderDiagnosticsLog();
    });

    document.getElementById('btn-copy-log').addEventListener('click', async () => {
      const logs = getDiagnosticsLog();
      try {
        await navigator.clipboard.writeText(JSON.stringify(logs, null, 2));
        alert('Diagnostics log copied to clipboard.');
      } catch (err) {
        alert('Failed to copy: ' + err.message);
      }
    });

    document.getElementById('btn-share-log').addEventListener('click', async () => {
      const logs = getDiagnosticsLog();
      const text = JSON.stringify(logs, null, 2);
      const filename = `lite-diagnostics-${new Date().toISOString().slice(0, 10)}.json`;

      if (navigator.canShare && window.File) {
        try {
          const file = new File([text], filename, { type: 'application/json' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'Lite Diagnostics Log',
              text: 'Diagnostics log stream'
            });
            return;
          }
        } catch (shareErr) {
          if (shareErr.name === 'AbortError') return;
        }
      }
      triggerDirectDownload(text, filename);
    });

    // Instrument existing subsystems for full activity logging
    const origFetchRegistry = fetchRegistryWithFallback;
    fetchRegistryWithFallback = async function() {
      logDiagnosticEvent('REGISTRY', 'FETCH_ATTEMPT', { url: REGISTRY_PRIMARY_URL });
      try {
        const data = await origFetchRegistry();
        logDiagnosticEvent('REGISTRY', 'FETCH_SUCCESS', { count: data.length });
        return data;
      } catch (err) {
        logDiagnosticEvent('REGISTRY', 'FETCH_FAILED', { error: err.message });
        throw err;
      }
    };

    const origRunSyncAll = runSyncAll;
    runSyncAll = async function() {
      logDiagnosticEvent('SYNC', 'SYNC_ALL_START', { appCount: LiteApp.state.registry.length });
      const startTime = performance.now();
      await origRunSyncAll();
      const elapsedMs = Math.round(performance.now() - startTime);
      logDiagnosticEvent('SYNC', 'SYNC_ALL_COMPLETE', { elapsedMs });
    };

    const origRunRefreshAll = runRefreshAll;
    runRefreshAll = async function() {
      logDiagnosticEvent('REFRESH', 'REFRESH_ALL_START', { appCount: LiteApp.state.registry.length });
      const startTime = performance.now();
      await origRunRefreshAll();
      const elapsedMs = Math.round(performance.now() - startTime);
      logDiagnosticEvent('REFRESH', 'REFRESH_ALL_COMPLETE', { elapsedMs });
    };

    // Log startup check & SW readiness
    logDiagnosticEvent('SW', 'CLIENT_INIT', { 
      standalone: window.matchMedia('(display-mode: standalone)').matches,
      hasServiceWorker: 'serviceWorker' in navigator
    });

    /* =========================================================
       SEGMENT 11: Polish & Edge Cases (Implemented)
       ========================================================= */

    // 1. Native Omega Shell / Standalone Runtime Detection
    function detectRuntimeEnvironment() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const insideOmegaShell = typeof PortalBridge !== 'undefined' && PortalBridge.isInsideShell();

      logDiagnosticEvent('BRIDGE', 'ENVIRONMENT_DETECTED', {
        standalone: isStandalone,
        insideOmegaShell,
        userAgent: navigator.userAgent
      });

      // If running inside Omega shell, ensure shell handles navigation gracefully
      if (insideOmegaShell) {
        try {
          PortalBridge.call('setThemeColor', { color: MOOD_BACKGROUNDS[LiteApp.state.activeMood] || '#0d0f12' })
            .catch(() => {});
        } catch (e) {}
      }
    }

    // 2. Hardware / Keyboard 'Escape' key handler for modals & sub-screens
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('profile-edit-modal');
        if (modal && !modal.classList.contains('hidden')) {
          modal.classList.add('hidden');
          modal.style.display = 'none';
          return;
        }

        const diagnosticsScreen = document.getElementById('diagnostics-screen');
        if (diagnosticsScreen && !diagnosticsScreen.classList.contains('hidden')) {
          showScreen('settings-screen');
          return;
        }

        const settingsScreen = document.getElementById('settings-screen');
        if (settingsScreen && !settingsScreen.classList.contains('hidden')) {
          showScreen('main-screen');
        }
      }
    });

    // 3. PWA Add to Home Screen / Install prompt handling
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredInstallPrompt = e;
      logDiagnosticEvent('SW', 'INSTALL_PROMPT_AVAILABLE', {});
    });

    // 4. Offline / Online network event logging
    window.addEventListener('online', () => {
      logDiagnosticEvent('REGISTRY', 'NETWORK_ONLINE', {});
      // Refresh registry if previously in offline cached state
      const banner = document.getElementById('registry-status-banner');
      if (banner && banner.innerHTML.trim() !== '') {
        loadRegistry();
      }
    });

    window.addEventListener('offline', () => {
      logDiagnosticEvent('REGISTRY', 'NETWORK_OFFLINE', {});
    });

    // Run environmental check on boot
    detectRuntimeEnvironment();
  </script>
